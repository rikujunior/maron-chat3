<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MARON chat3</title>

  <link rel="icon" type="image/png" sizes="32x32" href="./maron-chat3-icon-180.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./maron-chat3-icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">

  <meta name="theme-color" content="#08b9b0">
  <meta name="apple-mobile-web-app-title" content="MARON chat3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    html,body{height:100%;margin:0} body{font-family:Arial,"Yu Gothic",sans-serif;display:grid;place-items:center;background:#f7ffff;color:#123} .box{text-align:center;padding:32px} img{width:120px;height:120px;border-radius:27px;box-shadow:0 8px 30px rgba(0,80,80,.16)} h1{font-size:22px;margin:18px 0 8px} p{color:#607080} a{display:inline-block;padding:11px 18px;background:#08b9b0;color:#fff;text-decoration:none;border-radius:8px}
  </style>
</head>
<body>
  <div class="box">
    <img src="./maron-chat3-icon.png" alt="MARON chat3">
    <h1>MARON chat3</h1>
    <p>チャットを開いています…</p>
    <a id="open" href="#">チャットを開く</a>
  </div>

  <script>
    // ここにGASのウェブアプリURLを貼る
    const GAS_URL = "https://script.google.com/macros/s/AKfycbygwE_s_8-NNZbp886Y9CgMMUDrIUlFaLVhw6zPXBilm9r68nott42zZBNWSxZyPipV/exec";
    const a = document.getElementById('open');
    a.href = GAS_URL;
    if (GAS_URL.startsWith('http')) {
      setTimeout(() => location.replace(GAS_URL), 400);
    }
  </script>
</body>
</html>
